# Variables to change the name of the entities
substitutions:
  name: "hcpbridge"
  friendly_name: "Garage Door"
  connection_state: "${name} Connected"
  relay_name: "${friendly_name} Relay state"
  light: "${friendly_name} Light"
  btn_vent: "${friendly_name} Vent" 
  btn_half: "${friendly_name} Half" 
  btn_impulse: "${friendly_name} Impulse" 
  sen_txt: "${friendly_name} State" 
  sw_vent: "${friendly_name} Venting" 
  sw_half: "${friendly_name} Open Half" 
  sen_pos: "${friendly_name} Position"
  restart: "${friendly_name} Restart"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  libraries:
    # The registry version doesn't work with newer ESPHome (it needs a name= prefix
    # to resolve as a library, see https://esphome.io/components/esp32.html#libraries).
    # This fork also fixes a dead bounds check that could overflow a response buffer.
#    - emelianov/modbus-esp8266
     - modbus-esp8266=https://github.com/thomasdanz/modbus-esp8266
  on_boot:
    then:
      - script.execute: watch_connection

external_components:
  - source: github://thomasdanz/esphome-hcpbridge
    refresh: always
  # Only needed if a specific ESPHome release regresses uart behaviour you rely on;
  # pin a known-good version of just that component as a workaround.
#  - source: github://esphome/esphome@2025.9.3
#    refresh: never
#    components: [uart]

esp32:
  board: adafruit_feather_esp32s3 #set your board
  framework:
    type: arduino

hcpbridge:
  id: hcpbridge_id
  rx_pin: 18 # optional, default=18
  tx_pin: 17 # optional, default=17
  #rts_pin : 1 # optional RTS pin to use if hardware automatic control flow is not available.

cover:
  - platform: hcpbridge
    name: ${friendly_name}
    device_class: garage
    id: garagedoor_cover

binary_sensor:
  - platform: hcpbridge
    is_connected:
      name: "${connection_state}"
      id: sensor_connected
      on_press:
        - script.stop: watch_connection
        - script.execute: reset_attempts
      on_release:
        - script.stop: reset_attempts
        - script.execute: watch_connection
    relay_state:
      name: "${relay_name}"
      id: sensor_relay
      #on_state:
      #create your automation based on Garage Door Relay state

output:
  - platform: hcpbridge
    id: output_light

light:
  - platform: hcpbridge
    id: gd_light
    output: output_light
    name: ${light}

button:
  - platform: hcpbridge
    vent_button:
      id: button_vent
      name: "${btn_vent}"
    impulse_button:
      id: button_impulse
      name: "${btn_impulse}"
    half_button:
      id: button_half
      name: "${btn_half}"
  - platform: restart
    name: "${restart}"

text_sensor:
  - platform: hcpbridge
    id: sensor_templ_state
    name: "${sen_txt}"
#    filters:
#      - substitute:
#        - "Opening -> your text"
#        - "Move venting -> your text"
#        - "Move half -> your text"
#        - "Closing -> your text"
#        - "Open -> your text"
#        - "Closed -> your text"
#        - "Stopped -> your text"
#        - "Half open -> your text"
#        - "Venting -> your text"
#        - "Unknown -> your text"

switch:
  - platform: hcpbridge
    vent_switch:
      id: switch_vent
      name: "${sw_vent}"
      restore_mode: disabled
    half_switch:
      id: half_switch
      name: "${sw_half}"
      restore_mode: disabled

sensor:
  - platform: hcpbridge
    id: sensor_position
    name: ${sen_pos}

api:
  encryption:
    key: !secret api_key
  # The operator's HCP bus connection breaks on every ESP restart (see the
  # power-cycle automation near the end of this file), so avoid restarting for
  # reasons that would otherwise resolve themselves, like a brief API hiccup.
  reboot_timeout: 0s
  actions:
    - action: go_to_open
      then:
        - lambda: |-
            id(garagedoor_cover).on_go_to_open();
    - action: go_to_close
      then:
        - lambda: |-
            id(garagedoor_cover).on_go_to_close();
    - action: go_to_half
      then:
        - lambda: |-
            id(garagedoor_cover).on_go_to_half();
    - action: go_to_vent
      then:
        - lambda: |-
            id(garagedoor_cover).on_go_to_vent();
    - action: toggle
      then:
        - cover.toggle: garagedoor_cover

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # See the comment on api.reboot_timeout above.
  reboot_timeout: 0s

# Enable logging
logger:
#  level: DEBUG
  level: INFO
  # Optional: logging on UART0 adds a little latency to every log call, which
  # matters here because the operator expects a Modbus response within ~12ms.
  # Disabling it keeps logs available via the API / web_server instead.
#  baud_rate: 115200
  baud_rate: 0

# Example configuration entry
ota:
  - platform: esphome

# Automatic power cycle of the door operator if it does not resume polling after
# boot (e.g. after an OTA update, which briefly interrupts the HCP bus and puts
# the operator into an error state - see the project README/issues for details).
# Turns off a smart-plug switch that powers the operator (and, since the ESP is
# typically powered from the bus too, the ESP itself); the plug is expected to
# power back on by itself after a short delay via its own auto-on timer. At most
# 3 attempts, the counter is reset after 10 min of stable connection.
#
# Requirements to use this:
#  - A smart plug/relay in the operator's power supply, exposed in Home
#    Assistant as a switch, with a fixed auto-on timer configured on the plug
#    itself (e.g. a Shelly's "auto on" after 10s) - the plug must power back on
#    by itself, since HA (and the ESP) may not be reachable to do it for you.
#  - In Home Assistant, enable "Allow the device to perform Home Assistant
#    actions" for this ESPHome device.
#  - Replace switch.your_garage_door_operator_power below with your plug's
#    actual entity id.
globals:
  - id: cycle_attempts
    type: int
    restore_value: yes
    initial_value: '0'
    # Default flush interval is 1s; a value change only reaches flash on the next
    # tick (or on a graceful shutdown, which doesn't happen here - the plug cuts
    # power abruptly). Shorten it so the incremented count is saved well before
    # the power cycle we trigger right after. Cheap: only writes on an actual
    # change, otherwise just a memcmp.
    update_interval: 100ms

script:
  # Runs from boot / disconnect until the operator is connected again
  - id: watch_connection
    mode: restart
    then:
      # Must exceed the cold start time of the operator's own controller. Ours took
      # ~2.1s to resume polling after an ESP reboot; increase this if your operator
      # is slower and you see power cycles being triggered prematurely.
      - delay: 10s
      - while:
          condition:
            lambda: 'return !id(sensor_connected).state && id(cycle_attempts) < 3;'
          then:
            # Only count an attempt if HA is reachable, otherwise the action is dropped
            - if:
                condition:
                  api.connected:
                then:
                  - logger.log:
                      tag: hcpbridge
                      level: WARN
                      format: "Power cycling garage door operator (attempt %d/3)"
                      args: [ 'id(cycle_attempts) + 1' ]
                  - lambda: 'id(cycle_attempts)++;'
                  # The globals update_interval above only queues the new value in RAM
                  # (RestoringGlobalsComponent::update() -> preference.save()); the actual
                  # flash write only happens on global_preferences->sync(), which otherwise
                  # only runs every flash_write_interval (default 60s) or on a graceful
                  # shutdown - neither applies here, the plug cuts power abruptly. The
                  # delay gives the 100ms interval time to queue the change before we
                  # force the real flash commit ourselves.
                  - delay: 1s
                  - lambda: 'global_preferences->sync();'
                  # We're about to reboot ourselves well under the 60s ESPHome needs to
                  # consider a boot "good" (safe_mode: boot_is_good_after). Without this,
                  # every one of our own intentional power cycles counts as a suspicious
                  # quick reboot toward ESPHome's own (separate) boot-loop counter, which
                  # would eventually force the device into safe mode.
                  - safe_mode.mark_successful
                  - homeassistant.action:
                      action: switch.turn_off
                      data:
                        entity_id: switch.your_garage_door_operator_power
                  # Only reached if the power cycle did not happen
                  - delay: 2min
                else:
                  - delay: 10s
      # Still disconnected here only if cycle_attempts hit 3 (the while condition's
      # other half), whether that happened just now or already before this run.
      - if:
          condition:
            lambda: 'return !id(sensor_connected).state;'
          then:
            - logger.log:
                tag: hcpbridge
                level: WARN
                format: "Still disconnected after %d power cycle attempts, giving up until a stable reconnect resets the counter"
                args: [ 'id(cycle_attempts)' ]

  - id: reset_attempts
    mode: restart
    then:
      - delay: 10min
      - lambda: |-
          if (id(cycle_attempts) != 0) {
            ESP_LOGI("hcpbridge", "Connection stable for 10 min; resetting power cycle attempt counter");
            id(cycle_attempts) = 0;
          }
